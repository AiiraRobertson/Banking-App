services:
  - type: web
    name: kapita-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 20

      - key: JWT_SECRET
        generateValue: true

      - key: CLIENT_ORIGIN
        sync: false

      # Email verification (Resend) — set these in the Render dashboard.
      # APP_URL should point at the Netlify URL (e.g. https://kapita.netlify.app).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false