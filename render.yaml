services:
  - type: web
    name: kapita-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 20

      - key: JWT_SECRET
        generateValue: true

      - key: CLIENT_ORIGIN
        sync: false