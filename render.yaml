services:
  - type: web
    name: kapita-api
    runtime: node
    # Persistent disks require a paid plan (free tier has no disk).
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    disk:
      name: kapita-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 20

      - key: JWT_SECRET
        generateValue: true

      - key: CLIENT_ORIGIN
        sync: false

      - key: DB_PATH
        value: /var/data/bank.db