name: Keep Render API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -sS -m 30 -o /dev/null -w "HTTP %{http_code} | time %{time_total}s\n" \
            https://kapita-api.onrender.com/health || true
